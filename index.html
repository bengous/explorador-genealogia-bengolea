<!doctype html>
<!-- The shell is served in the default locale, the only one a static file can
     carry; `main.ts` corrects `lang` as soon as it knows which language is being
     asked for (`?lang=`, then `navigator.languages`), and `Page` corrects the
     title. The two Spanish words below are therefore the only ones the page shows
     without holding them from the catalogue, and only before the script runs. -->
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- The title of the open tree replaces it on load: the page does not know in
     advance which tree it will be given. -->
<title>Árbol genealógico</title>
<!-- `icon-512.png` stays beside them without being referenced: it is the original
     these two are drawn from, and one does not redraw an image on demand. -->
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32-22sgz3pd.png">
<link rel="apple-touch-icon" href="./icon-180-577kmveh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" crossorigin href="./chunk-1bwhnf6h.css"><script type="module" crossorigin src="./chunk-aexxa58q.js"></script></head>
<body>
<div id="app"></div>

</body>
</html>
